version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas_new_postgres  
    environment:
      POSTGRES_DB: atlas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword 
    ports:
      - "5432:5432"
    volumes:
      - atlas_new_postgres_data:/var/lib/postgresql/data 

volumes:
  atlas_new_postgres_data: